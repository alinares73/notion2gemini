<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gemini + Notion</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#131314">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GeminiNotion">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', 'Roboto', sans-serif; }
    body { background-color: #131314; color: #e3e3e3; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    header { padding: 16px 20px; font-size: 1.1rem; font-weight: 500; color: #c4c7c5; display: flex; align-items: center; gap: 10px; }
    .gemini-sparkle { background: linear-gradient(135deg, #4285f4, #9b72cb, #d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-weight: 700; font-size: 1.2rem; }
    .header-actions { margin-left: auto; display: flex; gap: 8px; }
    
    .header-icon-btn { background: #1e1f20; border: 1px solid #333537; color: #c4c7c5; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
    .header-icon-btn svg { width: 18px; height: 18px; fill: currentColor; }
    .header-icon-btn:hover { background-color: #282a2c; color: #ffffff; border-color: #5b5e62; }
    
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .header-icon-btn.advanced-active { background-color: #4a0000; border-color: #ff4a4a; color: #ff4a4a; }

    #chat-container { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 24px; scroll-behavior: smooth; }
    .welcome-screen { margin: auto 0; text-align: left; padding: 0 10px; }
    .welcome-title { font-size: 2.2rem; font-weight: 500; line-height: 1.2; background: linear-gradient(135deg, #4285f4, #9b72cb, #d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px; }
    .welcome-sub { color: #8e918f; font-size: 1.4rem; margin-bottom: 20px;}
    .sync-status { display: inline-flex; align-items: center; gap: 6px; font-size: 0.9rem; color: #8e918f; background: #1e1f20; padding: 6px 12px; border-radius: 12px; border: 1px solid #333537;}
    .sync-status.error { border-color: #d96570; color: #d96570; }

    .user-card { align-self: flex-end; background-color: #282a2c; color: #e3e3e3; padding: 12px 18px; border-radius: 20px; max-width: 85%; font-size: 1rem; line-height: 1.5; word-wrap: break-word; animation: slideUp 0.3s ease-out; }
    .gemini-wrapper { display: flex; flex-direction: column; gap: 8px; width: 100%; animation: fadeIn 0.4s ease-out; }
    .gemini-card { align-self: flex-start; width: 100%; font-size: 1rem; line-height: 1.6; color: #e3e3e3; display: flex; gap: 12px; }
    .gemini-icon { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #4285f4, #9b72cb, #d96570); flex-shrink: 0; margin-top: 2px; }
    .gemini-content { flex: 1; word-break: break-word; }
    .gemini-content h1, .gemini-content h2, .gemini-content h3 { color: #f1f3f4; margin-top: 14px; margin-bottom: 8px; font-weight: 600; }
    .gemini-content h3 { font-size: 1.15rem; }
    .gemini-content p { margin-bottom: 12px; }
    .gemini-content ul, .gemini-content ol { margin-left: 20px; margin-bottom: 12px; }
    .gemini-content li { margin-bottom: 6px; }
    .gemini-content strong { color: #ffffff; font-weight: 600; }
    .gemini-content a { color: #e3d5b8 !important; text-decoration: underline !important; text-underline-offset: 3px; font-weight: 500; }
    .gemini-content a:hover { color: #f4e8cb !important; }

    .action-bar { display: flex; gap: 12px; margin-left: 40px; margin-top: 4px; }
    .action-btn { background: transparent; border: 1px solid #333537; color: #c4c7c5; padding: 6px 12px; border-radius: 16px; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .action-btn:hover { background-color: #282a2c; color: #ffffff; border-color: #5b5e62; }
    .action-btn svg { width: 14px; height: 14px; fill: currentColor; }

    .typing-indicator { display: inline-flex; align-items: center; gap: 4px; color: #8e918f; font-style: italic; }
    .typing-dots span { width: 5px; height: 5px; background-color: #8e918f; border-radius: 50%; display: inline-block; animation: blink 1.4s infinite ease-in-out both; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

    .input-wrapper { padding: 12px 16px 20px 16px; background-color: #131314; }
    .input-pill { background-color: #1e1f20; border-radius: 28px; display: flex; align-items: center; padding: 8px 16px; border: 1px solid #333537; transition: border-color 0.2s; }
    .input-pill:focus-within { border-color: #5b5e62; }
    textarea { flex: 1; background: transparent; border: none; outline: none; color: #e3e3e3; font-size: 1rem; resize: none; max-height: 120px; min-height: 24px; line-height: 24px; }
    textarea::placeholder { color: #8e918f; }
    
    .send-btn { background: #e3e3e3; border: none; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-left: 8px; transition: all 0.2s; }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .send-btn svg { fill: #131314; width: 18px; height: 18px; transition: fill 0.2s; }
    .send-btn.advanced-active { background: #4a0000; border: 1px solid #ff4a4a; }
    .send-btn.advanced-active svg { fill: #ff4a4a; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; animation: fadeIn 0.2s; }
    .modal-card { background: #1e1f20; border: 1px solid #333537; padding: 24px; border-radius: 16px; width: 90%; max-width: 340px; display: flex; flex-direction: column; gap: 16px; }
    .modal-title { font-size: 1.1rem; font-weight: 500; color: #f1f3f4; }
    .checkbox-group { display: flex; flex-direction: column; gap: 12px; }
    .checkbox-label { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; color: #e3e3e3; cursor: pointer; }
    .checkbox-label input { accent-color: #4285f4; width: 18px; height: 18px; cursor: pointer; }

    @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .rate-limit-box { background-color: #281d1d; border: 1px solid #d96570; color: #e3e3e3; padding: 12px 16px; border-radius: 8px; display: inline-block; }
  </style>
</head>
<body>

  <header>
    <span class="gemini-sparkle">✦</span> Gemini + Notion
    <div class="header-actions">
      <button id="sync-btn" class="header-icon-btn" title="Actualizar notas">
        <svg id="sync-icon" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
      </button>
      <button id="sources-btn" class="header-icon-btn" title="Elegir Fuentes">
        <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
      </button>
      <button id="advanced-btn" class="header-icon-btn" title="Búsqueda Avanzada">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>
  </header>

  <div id="sources-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-title">Limitar consulta a fuentes:</div>
      <div class="checkbox-group">
        <label class="checkbox-label"><input type="checkbox" class="db-checkbox" value="Fichero citas" checked> Fichero citas</label>
        <label class="checkbox-label"><input type="checkbox" class="db-checkbox" value="Diario oración" checked> Diario oración</label>
        <label class="checkbox-label"><input type="checkbox" class="db-checkbox" value="Resúmenes de libros" checked> Resúmenes de libros</label>
      </div>
      <button id="close-modal-btn" class="action-btn" style="justify-content: center; margin-top: 8px;">Aceptar</button>
    </div>
  </div>

  <main id="chat-container">
    <div class="welcome-screen" id="welcome-screen">
      <div class="welcome-title">Hola</div>
      <div class="welcome-sub">¿Qué necesitas buscar de tu Notion?</div>
      <div id="db-status" class="sync-status">Comprobando caché de Notion...</div>
    </div>
  </main>

  <div class="input-wrapper">
    <div class="input-pill">
      <textarea id="prompt-input" rows="1" placeholder="Ej: &quot;Chiara Corbella&quot; o #biografias..."></textarea>
      <button id="send-btn" class="send-btn" disabled>
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(console.error));
    }

    const DB_NAME = "GeminiNotionCache";
    let db;
    
    function initDB() {
      return new Promise((resolve, reject) => {
        // AQUÍ ESTÁ LA MAGIA: Subimos la versión a 2. Esto borra la caché inútil de 500 caracteres 
        // y nos asegura descargar los extractos largos de 8000.
        const req = indexedDB.open(DB_NAME, 2); 
        req.onupgradeneeded = (e) => {
          db = e.target.result;
          if (db.objectStoreNames.contains('pages')) db.deleteObjectStore('pages');
          if (db.objectStoreNames.contains('meta')) db.deleteObjectStore('meta');
          db.createObjectStore('pages', { keyPath: 'id' });
          db.createObjectStore('meta', { keyPath: 'key' });
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(); };
        req.onerror = (e) => reject(e);
      });
    }

    function getMeta(key) {
      return new Promise((resolve) => {
        const tx = db.transaction('meta', 'readonly');
        const req = tx.objectStore('meta').get(key);
        req.onsuccess = () => resolve(req.result ? req.result.value : null);
      });
    }

    function setMeta(key, value) {
      return new Promise((resolve) => {
        const tx = db.transaction('meta', 'readwrite');
        tx.objectStore('meta').put({ key, value });
        tx.oncomplete = () => resolve();
      });
    }

    function getAllPages() {
      return new Promise((resolve) => {
        const tx = db.transaction('pages', 'readonly');
        const req = tx.objectStore('pages').getAll();
        req.onsuccess = () => resolve(req.result);
      });
    }

    function syncPages(updatedPages) {
      return new Promise((resolve) => {
        const tx = db.transaction('pages', 'readwrite');
        const store = tx.objectStore('pages');
        updatedPages.forEach(p => store.put(p));
        tx.oncomplete = () => resolve();
      });
    }

    const syncBtn = document.getElementById('sync-btn');
    const syncIcon = document.getElementById('sync-icon');
    const dbStatus = document.getElementById('db-status');

    async function performSync() {
      if (syncIcon.classList.contains('spin')) return; 
      syncIcon.classList.add('spin');
      dbStatus.classList.remove('error');
      
      try {
        const lastSync = await getMeta('last_sync');
        
        if (!lastSync) {
          dbStatus.textContent = "Recreando caché extendida por primera vez. Puede tardar unos minutos...";
        } else {
          dbStatus.textContent = "Sincronizando notas con Notion...";
        }
        
        let hasMore = true;
        let cursor = null;
        let totalDescargadas = 0;
        let finalSyncTime = null;

        while(hasMore) {
           const res = await fetch('/api/sync', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ last_sync: lastSync || null, cursor: cursor })
           });

           if (!res.ok) throw new Error("Fallo de red o servidor reiniciándose.");
           
           const data = await res.json();
           
           if(data.updated_pages.length > 0) {
               await syncPages(data.updated_pages);
               totalDescargadas += data.updated_pages.length;
               
               if (!lastSync) {
                 dbStatus.textContent = `Descargando textos ampliados... (${totalDescargadas} guardadas)`;
               } else {
                 dbStatus.textContent = `Actualizando... (${totalDescargadas} guardadas)`;
               }
           }

           cursor = data.next_cursor;
           hasMore = data.has_more;
           if (data.sync_time) finalSyncTime = data.sync_time;
        }
        
        if(finalSyncTime) await setMeta('last_sync', finalSyncTime);

        const total = (await getAllPages()).length;
        dbStatus.innerHTML = `✅ Caché lista: <strong>${total}</strong> notas ampliadas indexadas.`;

      } catch (err) {
        console.error("Detalle del error:", err);
        dbStatus.classList.add('error');
        dbStatus.textContent = "Fallo de conexión. El servidor tardó mucho o no tienes internet.";
      } finally {
        syncIcon.classList.remove('spin');
      }
    }

    syncBtn.addEventListener('click', performSync);

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        await initDB();
        const pages = await getAllPages();
        if (pages.length === 0) {
          await performSync();
        } else {
          dbStatus.innerHTML = `✅ Caché lista: <strong>${pages.length}</strong> notas ampliadas indexadas.`;
        }
      } catch (err) {
        console.error("Error cargando base de datos local:", err);
        dbStatus.textContent = "Error al abrir la memoria del navegador (Modo Incógnito?).";
      }
    });

    // ==========================================
    // MOTOR DE BÚSQUEDA LOCAL: ALGORITMO MEJORADO
    // ==========================================
    function normalizarStr(str) {
      if (!str) return "";
      return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function extraerFiltros(prompt) {
      const tags = [];
      const regexTags = /#([^\s,.]+)/g;
      let match;
      while ((match = regexTags.exec(prompt)) !== null) { tags.push(match[1]); }
      
      const frasesExactas = [];
      const regexFrases = /"([^"]+)"/g;
      let promptLimpio = prompt;
      
      while ((match = regexFrases.exec(prompt)) !== null) { 
        frasesExactas.push(normalizarStr(match[1])); 
        promptLimpio = promptLimpio.replace(match[0], ' '); 
      }
      
      const promptSemantico = promptLimpio.replace(/#[^\s,.]+/g, '').trim();
      const isOr = /#\w+\s+o\s+#\w+/.test(prompt.toLowerCase());
      
      return { tags, logica: isOr ? 'or' : 'and', promptSemantico, frasesExactas };
    }

    function puntuarPagina(pagina, palabrasClave) {
      let puntuacionTotal = 0;
      let palabrasEncontradasUnicas = 0;

      palabrasClave.forEach(palabra => {
        const tituloHits = (pagina.titulo_norm.match(new RegExp(palabra, 'g')) || []).length;
        const contHits = (pagina.contenido_norm.match(new RegExp(palabra, 'g')) || []).length;
        
        const hitsTotales = (tituloHits * 10) + contHits;
        if (hitsTotales > 0) {
          palabrasEncontradasUnicas++;
          puntuacionTotal += hitsTotales;
        }
      });

      // MAGIA: Multiplicador masivo para notas que coinciden con VARIAS palabras diferentes.
      // Una nota que tenga "chiara" Y "corbella" destruye en puntos a una que tenga "vida" 50 veces.
      if (palabrasEncontradasUnicas > 0) {
         return puntuacionTotal * Math.pow(10, palabrasEncontradasUnicas);
      }
      return 0;
    }

    async function buscarLocalmente(texto, advanced, basesDatos) {
      let pages = await getAllPages();
      const { tags, logica, promptSemantico, frasesExactas } = extraerFiltros(texto);

      if (basesDatos && basesDatos.length > 0) {
        const bdNorm = basesDatos.map(normalizarStr);
        pages = pages.filter(p => {
          const pDb = normalizarStr(p.db_nombre);
          return bdNorm.some(bdObj => {
            const palabrasBD = bdObj.split(" ");
            return palabrasBD.every(pal => pDb.includes(pal));
          });
        });
      }

      if (frasesExactas.length > 0) {
        pages = pages.filter(p => {
          const textoTotal = p.titulo_norm + " " + p.contenido_norm;
          return frasesExactas.every(frase => textoTotal.includes(frase));
        });
      }

      if (tags.length > 0) {
        const tagsNorm = tags.map(normalizarStr);
        pages = pages.filter(p => {
          const ptNorm = p.tags_norm || [];
          const coincidencias = tagsNorm.map(t => ptNorm.some(pt => pt.includes(t)));
          return logica === 'or' ? coincidencias.some(c=>c) : coincidencias.every(c=>c);
        });
      }

      const palabras = promptSemantico.split(/\s+/).map(normalizarStr).filter(w => w.length > 3);
      
      if (palabras.length > 0) {
        pages = pages.map(p => ({ p, score: puntuarPagina(p, palabras) }))
                     .filter(x => x.score > 0)
                     .sort((a, b) => b.score - a.score)
                     .map(x => x.p);
      }
      
      return advanced ? pages.slice(0, 60) : pages.slice(0, 20); 
    }

    const input = document.getElementById('prompt-input');
    const sendBtn = document.getElementById('send-btn');
    const chatContainer = document.getElementById('chat-container');
    const welcomeScreen = document.getElementById('welcome-screen');
    const sourcesBtn = document.getElementById('sources-btn');
    const sourcesModal = document.getElementById('sources-modal');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const advancedBtn = document.getElementById('advanced-btn');
    let isAdvancedMode = false;

    sourcesBtn.addEventListener('click', () => sourcesModal.style.display = 'flex');
    closeModalBtn.addEventListener('click', () => sourcesModal.style.display = 'none');
    sourcesModal.addEventListener('click', (e) => { if (e.target === sourcesModal) sourcesModal.style.display = 'none'; });

    advancedBtn.addEventListener('click', () => {
      isAdvancedMode = !isAdvancedMode;
      advancedBtn.classList.toggle('advanced-active', isAdvancedMode);
      sendBtn.classList.toggle('advanced-active', isAdvancedMode);
    });

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = input.scrollHeight + 'px';
      sendBtn.disabled = input.value.trim() === '';
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (input.value.trim() !== '') enviarMensaje(); }
    });

    sendBtn.addEventListener('click', enviarMensaje);

    async function enviarMensaje() {
      const texto = input.value.trim();
      if (!texto) return;

      if (welcomeScreen) welcomeScreen.style.display = 'none';

      const selectedDatabases = Array.from(document.querySelectorAll('.db-checkbox:checked')).map(cb => cb.value);

      const userCard = document.createElement('div');
      userCard.className = 'user-card';
      userCard.textContent = texto;
      chatContainer.appendChild(userCard);

      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;

      const wrapperDiv = document.createElement('div');
      wrapperDiv.className = 'gemini-wrapper';
      const geminiCard = document.createElement('div');
      geminiCard.className = 'gemini-card';
      const iconDiv = document.createElement('div');
      iconDiv.className = 'gemini-icon';
      const contentDiv = document.createElement('div');
      contentDiv.className = 'gemini-content typing-indicator';
      
      contentDiv.innerHTML = `Identificando candidatos locales <span class="typing-dots"><span></span><span></span><span></span></span>`;
      geminiCard.appendChild(iconDiv);
      geminiCard.appendChild(contentDiv);
      wrapperDiv.appendChild(geminiCard);
      chatContainer.appendChild(wrapperDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        const contextPages = await buscarLocalmente(texto, isAdvancedMode, selectedDatabases);

        if (contextPages.length === 0) {
           contentDiv.classList.remove('typing-indicator');
           contentDiv.innerHTML = "No encontré coincidencias exactas en tu caché local. Asegúrate de tener las notas sincronizadas 🔄.";
           return;
        }

        contentDiv.innerHTML = `Descargando y analizando con Gemini <span class="typing-dots"><span></span><span></span><span></span></span>`;

        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            prompt: texto, 
            advanced_search: isAdvancedMode,
            context_pages: contextPages
          })
        });

        if (!response.ok) {
            if (response.status === 429) {
                const errData = await response.json();
                throw { isRateLimit: true, waitSeconds: errData.detail.wait_seconds || 60 };
            }
            throw { isServerBusy: true };
        }

        const data = await response.json();
        contentDiv.classList.remove('typing-indicator');
        contentDiv.innerHTML = marked.parse(data.response);

        const actionBar = document.createElement('div');
        actionBar.className = 'action-bar';
        const copyBtn = document.createElement('button');
        copyBtn.className = 'action-btn';
        copyBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copiar`;
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(data.response).then(() => {
            copyBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg> ¡Copiado!`;
            setTimeout(() => { copyBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copiar`; }, 2000);
          });
        });

        actionBar.appendChild(copyBtn);
        wrapperDiv.appendChild(actionBar);

      } catch (error) {
        contentDiv.classList.remove('typing-indicator');
        if (error.isRateLimit) {
            contentDiv.innerHTML = `<div class="rate-limit-box">⚠️ <strong>Demasiadas peticiones a Gemini.</strong> Espera un poco.</div>`;
        } else {
            contentDiv.innerHTML = `<div class="rate-limit-box" style="border-color:#f4b400;">⏳ <strong>Servidor ocupado o procesando.</strong> Reintenta.</div>`;
        }
      } finally {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    }
  </script>
</body>
</html>
